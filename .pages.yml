# Configuration Pages CMS (https://pagescms.org) — à brancher plus tard
media:
  input: assets/img
  output: /assets/img
content:
  - name: site
    label: Coordonnées et textes communs
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: nom, label: Nom de la boulangerie, type: string }
      - { name: slogan, label: Slogan, type: string }
      - { name: metier, label: Sous-titre du logo, type: string }
      - { name: rue, label: Rue, type: string }
      - { name: codePostalVille, label: Code postal et ville, type: string }
      - { name: ville, label: Ville, type: string }
      - { name: telephone, label: Téléphone, type: string }
      - { name: email, label: E-mail, type: string }
      - { name: mentionAdresse, label: Mention courte après l'adresse, type: string }
      - { name: mentionAdresseLongue, label: Mention longue (page Contact), type: string }
      - { name: bandeau, label: Bandeau en haut de page, type: string }
      - { name: piedDemo, label: Texte du bas de page, type: text }
      - { name: indexation, label: Autoriser les moteurs de recherche (désactivé pour une démo), type: boolean }
  - name: horaires
    label: Horaires
    type: file
    path: content/horaires.json
    format: json
    fields:
      - { name: note, label: Note sous les horaires, type: text }
      - name: jours
        label: Jours
        type: object
        list: true
        fields:
          - { name: jour, label: Jour, type: string }
          - { name: ouvert, label: Ouvert, type: boolean }
          - { name: ouverture, label: Ouverture (HH:MM), type: string }
          - { name: fermeture, label: Fermeture (HH:MM), type: string }
  - name: produits
    label: Produits
    type: file
    path: content/produits.json
    format: json
    fields:
      - name: produits
        label: Produits
        type: object
        list: true
        fields:
          - { name: categorie, label: Catégorie (pains, viennoiseries, patisseries), type: string }
          - { name: nom, label: Nom, type: string }
          - { name: description, label: Description, type: string }
          - { name: prix, label: Prix en euros, type: number }
          - { name: momentane, label: Produit du moment, type: boolean }
  - name: actualites
    label: Actualités
    type: file
    path: content/actualites.json
    format: json
    fields:
      - name: actualites
        label: Actualités
        type: object
        list: true
        fields:
          - { name: date, label: Date, type: date }
          - { name: titre, label: Titre, type: string }
          - { name: texte, label: Texte, type: text }
          - { name: image, label: Image, type: image }
          - { name: alt, label: Description de l'image, type: string }
